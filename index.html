<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Synth</title>
<style>
  :root {
    --bg: #f4f1ec;
    --panel: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --accent: #c4511f;
    --line: #ddd6cc;
    --scope-bg: #1c1a17;
    --scope-grid: #2e2b27;
    --scope-trace: #ff8a4c;
    --key-white: #fbfaf7;
    --key-white-text: #6b665e;
    --key-black: #2a2723;
    --key-black-text: #d8d2c8;
    --roll-white: #ffffff;
    --roll-black: #f3efe9;
    --roll-line: #ece6dd;
    --roll-octave: #cfc6b9;
    --roll-head: rgba(196, 81, 31, .12);
    --roll-bar: #8f857a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311;
      --panel: #1e1c19;
      --text: #ece7df;
      --muted: #9a948a;
      --accent: #ff8a4c;
      --line: #34302b;
      --scope-bg: #0d0c0b;
      --scope-grid: #24211e;
      --key-white: #d9d3ca;
      --key-white-text: #3a3631;
      --key-black: #0f0e0d;
      --key-black-text: #9a948a;
      --roll-white: #24211e;
      --roll-black: #1a1816;
      --roll-line: #2c2925;
      --roll-octave: #46413a;
      --roll-head: rgba(255, 138, 76, .14);
      --roll-bar: #7a7166;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }
  canvas {
    width: 100%;
    height: 180px;
    display: block;
    border-radius: 8px;
    background: var(--scope-bg);
    margin-bottom: 20px;
  }
  .waves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
  .waves button {
    font: inherit; font-size: .85rem;
    padding: 10px 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .waves button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .control { margin-bottom: 16px; }
  .control label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 6px; }
  .control label span { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #power {
    width: 100%;
    font: inherit; font-weight: 600;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .hint { margin-top: 12px; font-size: .8rem; color: var(--muted); text-align: center; }
  kbd { font-family: ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

  /* Piano roll */
  .panel + .panel { margin-top: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
  .transport button {
    font: inherit; font-size: .85rem; font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .transport #play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 72px; }
  .transport .bpm { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 160px; font-size: .85rem; }
  .transport .bpm input { flex: 1; }
  .transport .bpm span { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .transport .seg button { border: none; border-radius: 0; padding: 8px 10px; font-weight: 500; }
  .transport .seg button + button { border-left: 1px solid var(--line); }
  .transport .seg button[aria-pressed="true"] { color: var(--accent); font-weight: 700; }

  .roll-wrap {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow-x: auto;
  }
  .roll {
    display: grid;
    grid-template-columns: 52px repeat(var(--steps), minmax(14px, 1fr));
    position: relative;
    user-select: none;
  }
  .key {
    font: 600 10px ui-monospace, monospace;
    height: 18px;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 6px;
    border: none;
    border-bottom: 1px solid var(--roll-line);
    background: var(--key-white);
    color: var(--key-white-text);
    cursor: pointer;
    position: sticky;
    left: 0;
    z-index: 2;
    touch-action: pan-x;
  }
  .key.black { background: var(--key-black); color: var(--key-black-text); }
  .key.c { border-bottom-color: var(--roll-octave); }
  .key.on { background: var(--accent); color: #fff; }
  .cell {
    height: 18px;
    border-left: 1px solid var(--roll-line);
    border-bottom: 1px solid var(--roll-line);
    background: var(--roll-white);
    cursor: crosshair;
    touch-action: none;
  }
  .cell.black { background: var(--roll-black); }
  .cell.c { border-bottom-color: var(--roll-octave); }
  .cell.beat { border-left-color: var(--roll-octave); }
  .cell.bar { border-left-color: var(--roll-bar); }
  .cell.head { box-shadow: inset 0 0 0 999px var(--roll-head); }
  .note {
    position: relative;
    z-index: 1;
    margin: 1px 0 2px 1px;
    border-radius: 3px;
    background: var(--accent);
    cursor: ew-resize;
    touch-action: none;
  }
  .note::after { /* resize grip */
    content: "";
    position: absolute;
    right: 3px; top: 4px; bottom: 4px;
    width: 2px;
    border-radius: 1px;
    background: rgba(255,255,255,.55);
  }
  .note.playing { filter: brightness(1.3); }
</style>
</head>
<body>
<main>
  <h1>Turkey Synth</h1>
  <p class="sub">A simple waveform oscillator.</p>
  <div class="panel">
    <canvas id="scope"></canvas>

    <div class="waves" role="group" aria-label="Waveform">
      <button data-wave="sine" aria-pressed="true">Sine</button>
      <button data-wave="square" aria-pressed="false">Square</button>
      <button data-wave="sawtooth" aria-pressed="false">Saw</button>
      <button data-wave="triangle" aria-pressed="false">Triangle</button>
    </div>

    <div class="control">
      <label for="freq">Frequency <span id="freqVal"></span></label>
      <input id="freq" type="range" min="0" max="1000" value="347">
    </div>
    <div class="control">
      <label for="detune">Detune <span id="detuneVal"></span></label>
      <input id="detune" type="range" min="-100" max="100" value="0">
    </div>
    <div class="control">
      <label for="vol">Volume <span id="volVal"></span></label>
      <input id="vol" type="range" min="0" max="100" value="30">
    </div>

    <button id="power">Start</button>
    <p class="hint"><kbd>Space</kbd> start/stop · <kbd>1</kbd>–<kbd>4</kbd> waveform</p>
  </div>

  <div class="panel">
    <h2>Piano roll</h2>
    <div class="transport">
      <button id="play">Play</button>
      <button id="clear">Clear</button>
      <div class="seg" id="bars" role="group" aria-label="Loop length">
        <button data-bars="1" aria-pressed="true">1 bar</button>
        <button data-bars="2" aria-pressed="false">2</button>
        <button data-bars="4" aria-pressed="false">4</button>
      </div>
      <label class="bpm" for="bpm">Tempo <input id="bpm" type="range" min="60" max="200" value="120"><span id="bpmVal"></span></label>
    </div>
    <div class="roll-wrap" id="rollWrap"><div class="roll" id="roll"></div></div>
    <p class="hint">Click a cell and drag right to draw a note · drag a note to change its length · click a note to delete it · click a key to hear it</p>
  </div>
</main>

<script>
  const MIN_F = 20, MAX_F = 20000;
  const $ = (id) => document.getElementById(id);
  const freqEl = $('freq'), detuneEl = $('detune'), volEl = $('vol'), powerEl = $('power');
  const waveBtns = [...document.querySelectorAll('.waves button')];

  let ctx, osc, gain, analyser, noteBus, noteVol, running = false, wave = 'sine';

  const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const midiName = (m) => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
  function nearestNote(f) {
    const exact = 69 + 12 * Math.log2(f / 440);
    const m = Math.round(exact);
    const cents = Math.round((exact - m) * 100);
    return midiName(m) + (cents ? (cents > 0 ? ' +' : ' ') + cents + 'ct' : '');
  }

  // Slider position (0–1000) -> frequency on a log scale.
  const sliderToFreq = (v) => MIN_F * Math.pow(MAX_F / MIN_F, v / 1000);
  const freq = () => sliderToFreq(+freqEl.value);
  const vol = () => Math.pow(+volEl.value / 100, 2); // perceptual-ish curve

  function updateLabels() {
    const f = freq();
    $('freqVal').textContent = (f >= 1000 ? (f / 1000).toFixed(2) + ' kHz' : f.toFixed(1) + ' Hz') + ' · ' + nearestNote(f);
    $('detuneVal').textContent = (+detuneEl.value > 0 ? '+' : '') + detuneEl.value + ' ct';
    $('volVal').textContent = volEl.value + '%';
  }

  function initAudio() {
    ctx = new AudioContext();
    gain = ctx.createGain();
    gain.gain.value = 0;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    gain.connect(ctx.destination);
    // Piano-roll voices sum into noteBus (feeds the scope), then noteVol sets loudness.
    noteBus = ctx.createGain();
    noteVol = ctx.createGain();
    noteVol.gain.value = vol() * 0.5;
    const scopeTrim = ctx.createGain(); // headroom so chords fit on the scope
    scopeTrim.gain.value = 0.4;
    noteBus.connect(scopeTrim);
    scopeTrim.connect(analyser);
    noteBus.connect(noteVol);
    noteVol.connect(ctx.destination);
  }

  function start() {
    if (!ctx) initAudio();
    ctx.resume();
    osc = ctx.createOscillator();
    osc.type = wave;
    osc.frequency.value = freq();
    osc.detune.value = +detuneEl.value;
    osc.connect(gain);
    osc.connect(analyser); // scope taps pre-volume so the trace stays readable
    osc.start();
    const t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(vol(), t + 0.02); // short fade to avoid clicks
    running = true;
    powerEl.textContent = 'Stop';
  }

  function stop() {
    const t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.03);
    osc.stop(t + 0.04);
    osc = null;
    running = false;
    powerEl.textContent = 'Start';
  }

  const toggle = () => (running ? stop() : start());

  function setWave(w) {
    wave = w;
    waveBtns.forEach((b) => b.setAttribute('aria-pressed', b.dataset.wave === w));
    if (osc) osc.type = w;
  }

  powerEl.addEventListener('click', toggle);
  waveBtns.forEach((b) => b.addEventListener('click', () => setWave(b.dataset.wave)));

  freqEl.addEventListener('input', () => {
    updateLabels();
    if (osc) osc.frequency.setTargetAtTime(freq(), ctx.currentTime, 0.01);
  });
  detuneEl.addEventListener('input', () => {
    updateLabels();
    if (osc) osc.detune.setTargetAtTime(+detuneEl.value, ctx.currentTime, 0.01);
  });
  volEl.addEventListener('input', () => {
    updateLabels();
    if (running) gain.gain.setTargetAtTime(vol(), ctx.currentTime, 0.01);
    if (noteVol) noteVol.gain.setTargetAtTime(vol() * 0.5, ctx.currentTime, 0.01);
  });

  // ---- Piano roll ----
  // Notes are {m, start, len} in 16th-note steps; the loop is 1, 2 or 4 bars long.
  const LOW = 48, HIGH = 71, STEPS_PER_BAR = 16, KEY_W = 52; // C3–B4
  const rows = [];
  for (let m = HIGH; m >= LOW; m--) rows.push(m);
  const rowOf = {};
  rows.forEach((m, r) => (rowOf[m] = r));
  const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);
  const rollEl = $('roll'), wrapEl = $('rollWrap');
  const keyEls = {};
  let steps = STEPS_PER_BAR, notes = [], cellCols = [], headStep = -1;

  function buildGrid() {
    rollEl.innerHTML = '';
    rollEl.style.setProperty('--steps', steps);
    cellCols = Array.from({ length: steps }, () => []);
    rows.forEach((m, r) => {
      const key = document.createElement('button');
      key.className = 'key' + (isBlack(m) ? ' black' : '') + (m % 12 === 0 ? ' c' : '');
      key.textContent = midiName(m);
      key.title = midiName(m) + ' · ' + midiToFreq(m).toFixed(1) + ' Hz';
      key.style.gridArea = `${r + 1} / 1`;
      key.addEventListener('pointerdown', () => { ensureAudio(); playNote(m, ctx.currentTime, 0.35); flashKey(m, 350); });
      rollEl.appendChild(key);
      keyEls[m] = key;
      for (let s = 0; s < steps; s++) {
        const c = document.createElement('div');
        c.className = 'cell' + (isBlack(m) ? ' black' : '') + (m % 12 === 0 ? ' c' : '') +
          (s % STEPS_PER_BAR === 0 && s ? ' bar' : s % 4 === 0 ? ' beat' : '');
        c.dataset.m = m;
        c.dataset.s = s;
        c.style.gridArea = `${r + 1} / ${s + 2}`;
        rollEl.appendChild(c);
        cellCols[s].push(c);
      }
    });
    headStep = -1;
    notes.forEach((n) => { n.el = null; renderNote(n); });
  }

  function renderNote(n) {
    if (!n.el) {
      n.el = document.createElement('div');
      n.el.className = 'note';
      n.el._note = n;
    }
    n.el.style.gridArea = `${rowOf[n.m] + 1} / ${n.start + 2} / auto / span ${n.len}`;
    n.el.title = `${midiName(n.m)} · ${n.len} step${n.len > 1 ? 's' : ''}`;
    if (!n.el.parentNode) rollEl.appendChild(n.el);
  }

  function addNote(m, start, len) {
    const n = { m, start, len: 1 };
    notes.push(n);
    n.len = Math.max(1, Math.min(len, maxLen(n)));
    renderNote(n);
    return n;
  }

  function removeNote(n) {
    n.el.remove();
    notes = notes.filter((x) => x !== n);
  }

  // Longest a note can get before it hits the next note on its row or the loop end.
  function maxLen(n) {
    let end = steps;
    for (const o of notes) if (o !== n && o.m === n.m && o.start > n.start) end = Math.min(end, o.start);
    return end - n.start;
  }

  function stepAt(clientX) {
    const r = rollEl.getBoundingClientRect();
    const s = Math.floor((clientX - r.left - KEY_W) / ((r.width - KEY_W) / steps));
    return Math.max(0, Math.min(steps - 1, s));
  }

  // Empty cell: add a note and drag right to lengthen it.
  // Existing note: drag to resize, click to delete.
  let drag = null;
  rollEl.addEventListener('pointerdown', (e) => {
    const noteEl = e.target.closest('.note');
    const cell = e.target.closest('.cell');
    if (!noteEl && !cell) return;
    e.preventDefault();
    let n, created = false;
    if (noteEl) {
      n = noteEl._note;
    } else {
      n = addNote(+cell.dataset.m, +cell.dataset.s, 1);
      created = true;
      ensureAudio();
      playNote(n.m, ctx.currentTime, 0.2);
      flashKey(n.m, 200);
    }
    drag = { n, created, moved: false, s0: stepAt(e.clientX), len0: n.len };
    rollEl.setPointerCapture(e.pointerId);
  });
  rollEl.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const { n } = drag;
    const len = Math.max(1, Math.min(maxLen(n), drag.len0 + stepAt(e.clientX) - drag.s0));
    if (len !== n.len) { n.len = len; drag.moved = true; renderNote(n); }
  });
  const endDrag = () => {
    if (drag && !drag.created && !drag.moved) removeNote(drag.n);
    drag = null;
  };
  rollEl.addEventListener('pointerup', endDrag);
  rollEl.addEventListener('pointercancel', () => (drag = null));

  function setBars(b) {
    steps = b * STEPS_PER_BAR;
    notes = notes.filter((n) => n.start < steps);
    notes.forEach((n) => (n.len = Math.min(n.len, steps - n.start)));
    document.querySelectorAll('#bars button').forEach((btn) => btn.setAttribute('aria-pressed', +btn.dataset.bars === b));
    headQueue = [];
    buildGrid();
  }
  document.querySelectorAll('#bars button').forEach((btn) => btn.addEventListener('click', () => setBars(+btn.dataset.bars)));

  function ensureAudio() {
    if (!ctx) initAudio();
    ctx.resume();
  }

  function playNote(m, when, dur) {
    const o = ctx.createOscillator();
    const env = ctx.createGain();
    o.type = wave;
    o.frequency.value = midiToFreq(m);
    o.detune.value = +detuneEl.value;
    env.gain.setValueAtTime(0, when);
    env.gain.linearRampToValueAtTime(1, when + 0.005);
    env.gain.setTargetAtTime(0.7, when + 0.005, 0.08);
    env.gain.setTargetAtTime(0, when + dur, 0.03);
    o.connect(env);
    env.connect(noteBus);
    o.start(when);
    o.stop(when + dur + 0.2);
  }

  const flashTimers = new Map();
  function flash(el, cls, ms) {
    el.classList.add(cls);
    clearTimeout(flashTimers.get(el));
    flashTimers.set(el, setTimeout(() => el.classList.remove(cls), ms));
  }
  const flashKey = (m, ms) => flash(keyEls[m], 'on', ms);

  // Lookahead scheduler: audio timing stays tight even if the UI thread stutters.
  const bpmEl = $('bpm'), playEl = $('play');
  let seqTimer = null, nextStep = 0, nextTime = 0, headQueue = [];
  const stepDur = () => 60 / +bpmEl.value / 4;

  function schedule() {
    while (nextTime < ctx.currentTime + 0.1) {
      if (nextStep >= steps) nextStep = 0;
      const starting = notes.filter((n) => n.start === nextStep);
      for (const n of starting) playNote(n.m, nextTime, stepDur() * (n.len - 0.1));
      headQueue.push({ step: nextStep, time: nextTime, starting });
      nextTime += stepDur();
      nextStep = (nextStep + 1) % steps;
    }
  }

  function setHead(step, starting = []) {
    if (step === headStep) return;
    if (cellCols[headStep]) cellCols[headStep].forEach((c) => c.classList.remove('head'));
    headStep = cellCols[step] ? step : -1;
    if (headStep < 0) return;
    cellCols[step].forEach((c) => c.classList.add('head'));
    for (const n of starting) {
      const ms = stepDur() * n.len * 1000 * 0.95;
      flashKey(n.m, ms);
      if (n.el) flash(n.el, 'playing', ms);
    }
    // Keep the playhead in view when the roll scrolls sideways.
    const c = cellCols[step][0];
    if (c.offsetLeft + c.offsetWidth > wrapEl.scrollLeft + wrapEl.clientWidth || c.offsetLeft - KEY_W < wrapEl.scrollLeft) {
      wrapEl.scrollLeft = c.offsetLeft - KEY_W;
    }
  }

  function updateHead() {
    if (!ctx) return;
    while (headQueue.length && headQueue[0].time <= ctx.currentTime) {
      const h = headQueue.shift();
      setHead(h.step, h.starting);
    }
  }

  playEl.addEventListener('click', () => {
    if (seqTimer) {
      clearInterval(seqTimer);
      seqTimer = null;
      headQueue = [];
      setHead(-1);
      playEl.textContent = 'Play';
      return;
    }
    ensureAudio();
    nextStep = 0;
    nextTime = ctx.currentTime + 0.05;
    schedule();
    seqTimer = setInterval(schedule, 25);
    playEl.textContent = 'Stop';
  });
  $('clear').addEventListener('click', () => [...notes].forEach(removeNote));
  const updateBpm = () => ($('bpmVal').textContent = bpmEl.value + ' BPM');
  bpmEl.addEventListener('input', updateBpm);
  updateBpm();

  buildGrid();
  // A short starter phrase with mixed note lengths so Play does something right away.
  [[48, 0, 8], [55, 8, 8], [60, 0, 2], [64, 2, 2], [67, 4, 4], [71, 8, 1], [69, 9, 1], [67, 10, 2], [64, 12, 4]]
    .forEach(([m, s, len]) => addNote(m, s, len));

  // Oscilloscope
  const canvas = $('scope');
  const g = canvas.getContext('2d');
  let buf;

  function draw() {
    requestAnimationFrame(draw);
    updateHead();
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr; canvas.height = h * dpr;
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const css = getComputedStyle(document.documentElement);
    g.fillStyle = css.getPropertyValue('--scope-bg');
    g.fillRect(0, 0, w, h);

    // grid
    g.strokeStyle = css.getPropertyValue('--scope-grid');
    g.lineWidth = 1;
    g.beginPath();
    for (let x = 0; x <= w; x += w / 8) { g.moveTo(x, 0); g.lineTo(x, h); }
    for (let y = 0; y <= h; y += h / 4) { g.moveTo(0, y); g.lineTo(w, y); }
    g.stroke();

    if (!analyser) return;
    if (!buf) buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);

    // Find a rising zero crossing so the trace stays stable.
    let start = 0;
    for (let i = 1; i < buf.length / 2; i++) {
      if (buf[i - 1] < 0 && buf[i] >= 0) { start = i; break; }
    }
    const span = buf.length / 2;
    g.strokeStyle = css.getPropertyValue('--scope-trace');
    g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < span; i++) {
      const x = (i / span) * w;
      const y = h / 2 - buf[start + i] * (h / 2) * 0.9;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }

  updateLabels();
  draw();
</script>
</body>
</html>
